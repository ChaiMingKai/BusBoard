name: Build release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine version and tag
        id: version
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          [ -n "$VERSION" ] || { echo "versionName not found"; exit 1; }
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"; else TAG="v$VERSION"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release $TAG"
      - name: Skip if release already exists
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, skipping."
            echo "skip=true" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        if: env.skip != 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        if: env.skip != 'true'
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Decode release keystore
        if: env.skip != 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/busboard-release.p12"
          test -s "$RUNNER_TEMP/busboard-release.p12" || { echo "keystore decode failed"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/busboard-release.p12" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -storetype PKCS12 > /dev/null || { echo "keystore invalid or wrong password"; exit 1; }
      - name: Build signed release APK
        if: env.skip != 'true'
        run: bash gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/busboard-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Create release with APK
        if: env.skip != 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk "BusBoard-${{ steps.version.outputs.tag }}.apk"
          gh release create "${{ steps.version.outputs.tag }}" "BusBoard-${{ steps.version.outputs.tag }}.apk" \
            --title "BusBoard ${{ steps.version.outputs.tag }}" \
            --notes "BusBoard ${{ steps.version.outputs.tag }}: direct APK download from the update dialog, Out/Back widget direction (green/red bus numbers), signed release build."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
