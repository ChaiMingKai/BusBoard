plugins { id 'com.android.application' }

def releaseKeystoreFile = System.getenv('KEYSTORE_FILE')
def releaseKeystorePassword = System.getenv('KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('KEY_ALIAS')
def releaseKeyPassword = System.getenv('KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystoreFile, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace 'sg.busboard'
    compileSdk 35
    defaultConfig {
        applicationId 'sg.busboard'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.7'
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
